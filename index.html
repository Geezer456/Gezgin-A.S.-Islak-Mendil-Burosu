<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gezgin A.Ş. Islak Mendil Bürosu v2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --accent: #ff7a00; /* Turuncu Tema */
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Panel */
        #sidebar {
            width: 260px;
            padding: 25px;
            border-right: 3px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 { color: var(--accent); font-size: 22px; margin-bottom: 10px; line-height: 1.2; }
        .stats { font-size: 14px; color: #aaa; margin-bottom: 20px; }

        .btn {
            background-color: var(--accent);
            color: black;
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn:hover { transform: scale(1.02); opacity: 0.9; }
        
        .category-btn {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            cursor: pointer;
            text-align: left;
            border-radius: 4px;
        }

        .category-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Sağ Galeri Alanı */
        #main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
            position: relative;
            border: 2px solid transparent;
            transition: 0.3s;
            text-align: center;
        }

        .card:hover { border-color: var(--accent); }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
        }

        .qty-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: black;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* Kamera Modalı */
        #camera-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        video { width: 90%; max-width: 500px; border-radius: 10px; border: 2px solid var(--accent); }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>Gezgin A.Ş.<br>Islak Mendil Bürosu</h1>
    <div id="count-info" class="stats">Veriler yükleniyor...</div>
    
    <button class="btn" onclick="startCamera()">📸 Yeni Mendil Ekle</button>
    
    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px;">
        <p style="font-size: 12px; color: #666; margin: 0;">KLASÖRLER</p>
        <button class="category-btn active" onclick="changeCat('yaygin', this)">🗂️ Yaygın</button>
        <button class="category-btn" onclick="changeCat('nadide', this)">🗂️ Nadide</button>
        <button class="category-btn" onclick="changeCat('efsanevi', this)">🗂️ Efsanevi</button>
    </div>

    <div style="margin-top: auto; font-size: 10px; color: #444;">LGS.OS Cloud System v2.0</div>
</div>

<div id="main">
    <div id="gallery">
        </div>
</div>

<div id="camera-modal">
    <video id="video" autoplay playsinline></video>
    <div style="margin-top: 20px; display: flex; gap: 15px;">
        <button class="btn" onclick="captureAndUpload()">📸 FOTOĞRAFI ÇEK</button>
        <button class="btn" style="background:#444; color:white;" onclick="stopCamera()">İPTAL</button>
    </div>
    <canvas id="photo-canvas" style="display:none;"></canvas>
</div>

<script>
    // --- SUPABASE AYARLARI ---
    const S_URL = "https://pqjistofpcjunfescntg.supabase.co";
    const S_KEY = "sb_publishable_X13SKaqohlb49BYKiZp3xg_UDn7CRCY"; 
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    let currentCategory = 'yaygin';

    // --- VERİLERİ ÇEK ---
    async function loadData() {
        const info = document.getElementById('count-info');
        const { data, error } = await supabaseClient
            .from('mendiller')
            .select('*')
            .eq('category', currentCategory)
            .order('id', { ascending: false });

        if (error) {
            info.innerText = "Bağlantı Hatası!";
            return;
        }

        const container = document.getElementById('gallery');
        container.innerHTML = '';
        info.innerText = `${currentCategory.toUpperCase()}: ${data.length} adet`;

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                ${item.qty > 1 ? `<div class="qty-badge">x${item.qty}</div>` : ''}
                <img src="${item.image_url}" alt="${item.name}">
                <div style="margin-top:8px; font-weight:bold; font-size:13px;">${item.name}</div>
            `;
            // Sağ tıkla silme özelliği
            card.oncontextmenu = (e) => {
                e.preventDefault();
                if(confirm(`${item.name} silinsin mi?`)) deleteItem(item.id);
            };
            container.appendChild(card);
        });
    }

    // --- KATEGORİ DEĞİŞTİR ---
    function changeCat(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadData();
    }

    // --- KAMERA YÖNETİMİ ---
    const video = document.getElementById('video');
    async function startCamera() {
        document.getElementById('camera-modal').style.display = 'flex';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
    }

    function stopCamera() {
        if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('camera-modal').style.display = 'none';
    }

    // --- FOTOĞRAF ÇEK VE BULUTA YÜKLE ---
    async function captureAndUpload() {
        const canvas = document.getElementById('photo-canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        const name = prompt("Bu ıslak mendilin markası/adı nedir?");
        if (!name) return;

        document.getElementById('count-info').innerText = "Yükleniyor... Sabret kanki.";

        canvas.toBlob(async (blob) => {
            const fileName = `mendil_${Date.now()}.jpg`;

            // 1. Storage'a yükle (mendil_fotolari kovasına)
            const { data: sData, error: sErr } = await supabaseClient.storage
                .from('mendil_fotolari')
                .upload(fileName, blob);

            if (sErr) { alert("Yükleme hatası: " + sErr.message); return; }

            // 2. Linki al
            const { data: urlData } = supabaseClient.storage
                .from('mendil_fotolari')
                .getPublicUrl(fileName);

            // 3. Veritabanına kaydet
            const { error: dbErr } = await supabaseClient
                .from('mendiller')
                .insert([{
                    name: name,
                    category: currentCategory,
                    image_url: urlData.publicUrl,
                    qty: 1
                }]);

            if (dbErr) alert("Veritabanı hatası: " + dbErr.message);
            
            stopCamera();
            loadData();
        }, 'image/jpeg', 0.8);
    }

    // --- SİLME FONKSİYONU ---
    async function deleteItem(id) {
        const { error } = await supabaseClient.from('mendiller').delete().eq('id', id);
        if (!error) loadData();
    }

    // Sayfa açılınca verileri getir
    loadData();
</script>

</body>
</html>
