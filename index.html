<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gezgin A.Ş. Islak Mendil Bürosu</title>
    <style>
        :root {
            --accent: #ff7a00;
            --bg: #0f0f0f;
            --text: #ffffff;
            --card-bg: #1a1a1a;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Panel */
        #sidebar {
            width: 300px;
            padding: 20px;
            border-right: 3px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 { color: var(--accent); font-size: 24px; margin-bottom: 20px; }

        .btn {
            background-color: var(--accent);
            color: black;
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn:hover { opacity: 0.8; }

        input[type="text"] {
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }

        /* Galeri Alanı */
        #main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
        }

        .wipe-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            position: relative;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .wipe-card:hover { border-color: var(--accent); }

        .wipe-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--accent);
            color: black;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Kamera Modalı */
        #camera-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        video { width: 80%; max-width: 640px; border: 2px solid var(--accent); }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>Islak Mendil<br>Koleksiyonu</h1>
    <div id="counter">Toplam: 0 adet</div>
    
    <button class="btn" onclick="openCamera()">📸 Kamera ile Ekle</button>
    
    <input type="text" id="search" placeholder="Mendil ara..." onkeyup="refreshGallery()">

    <div style="display: flex; gap: 5px;">
        <button class="btn" onclick="cycleTheme()">🎨</button>
        <button class="btn" onclick="randomWipe()">🎲</button>
        <button class="btn" onclick="showStats()">📊</button>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 5px;">
        <button class="btn" onclick="setCategory('yaygin')">🗂️ Yaygın</button>
        <button class="btn" onclick="setCategory('nadide')">🗂️ Nadide</button>
        <button class="btn" onclick="setCategory('efsanevi')">🗂️ Efsanevi</button>
        <button class="btn" onclick="setCategory('favoriler')">❤️ Favoriler</button>
    </div>
</div>

<div id="main-content">
    <div id="gallery"></div>
</div>

<div id="camera-modal">
    <video id="video" autoplay></video>
    <div style="margin-top: 20px; gap: 10px; display: flex;">
        <button class="btn" onclick="capturePhoto()">📸 Çek</button>
        <button class="btn" style="background: #ccc;" onclick="closeCamera()">İptal</button>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
    let wipes = JSON.parse(localStorage.getItem('wipes')) || [];
    let currentCategory = 'nadide';
    const themes = ["#ff7a00", "#2ecc71", "#3498db", "#ffffff", "#f1c40f", "#e84393", "#e74c3c"];
    let themeIdx = 0;

    // --- TEMA SİSTEMİ ---
    function cycleTheme() {
        themeIdx = (themeIdx + 1) % themes.length;
        document.documentElement.style.setProperty('--accent', themes[themeIdx]);
    }

    // --- KAMERA İŞLEMLERİ ---
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    async function openCamera() {
        document.getElementById('camera-modal').style.display = 'flex';
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
    }

    function closeCamera() {
        video.srcObject.getTracks().forEach(track => track.stop());
        document.getElementById('camera-modal').style.display = 'none';
    }

    function capturePhoto() {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0);
        
        const name = prompt("Bu mendilin adı nedir?");
        if(name) {
            const newWipe = {
                id: Date.now(),
                name: name,
                img: canvas.toDataURL('image/jpeg'),
                category: currentCategory,
                qty: 1
            };
            wipes.push(newWipe);
            save();
            refreshGallery();
        }
        closeCamera();
    }

    // --- GALERİ VE MANTIK ---
    function save() {
        localStorage.setItem('wipes', JSON.stringify(wipes));
    }

    function setCategory(cat) {
        currentCategory = cat;
        refreshGallery();
    }

    function refreshGallery() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('gallery');
        container.innerHTML = '';
        
        const filtered = wipes.filter(w => 
            (currentCategory === 'favoriler' ? w.isFavorite : w.category === currentCategory) &&
            w.name.toLowerCase().includes(query)
        );

        filtered.forEach(w => {
            const card = document.createElement('div');
            card.className = 'wipe-card';
            card.innerHTML = `
                ${w.qty > 1 ? `<span class="badge">${w.qty}</span>` : ''}
                <img src="${w.img}">
                <div style="margin-top:5px; font-size:12px;">${w.name}</div>
            `;
            card.onclick = () => { if(confirm("Miktarı artır?")) { w.qty++; save(); refreshGallery(); }};
            card.oncontextmenu = (e) => {
                e.preventDefault();
                if(confirm("Silinsin mi?")) {
                    wipes = wipes.filter(item => item.id !== w.id);
                    save(); refreshGallery();
                }
            };
            container.appendChild(card);
        });

        document.getElementById('counter').innerText = `Toplam: ${wipes.length} adet`;
    }

    function showStats() {
        const stats = wipes.reduce((acc, curr) => {
            acc[curr.category] = (acc[curr.category] || 0) + 1;
            return acc;
        }, {});
        alert(`📊 İstatistikler:\nYaygın: ${stats.yaygin || 0}\nNadide: ${stats.nadide || 0}\nEfsanevi: ${stats.efsanevi || 0}`);
    }

    function randomWipe() {
        if(wipes.length === 0) return alert("Koleksiyon boş!");
        const rand = wipes[Math.floor(Math.random() * wipes.length)];
        alert("🎲 Şansına gelen mendil: " + rand.name);
    }

    refreshGallery();
</script>
</body>
</html>
